<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100D0A">
  <title>Email confirmado · Nemesy RPG</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; background: #100D0A; color: #E8DCC0; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 30px 24px; text-align: center; border: 1px solid #3D3020; border-radius: 10px; background: #1C1712; box-shadow: 0 16px 48px rgba(0, 0, 0, .35); }
    .mark { width: 58px; height: 58px; margin: 0 auto 16px; display: grid; place-items: center; border: 1px solid #729A5E; border-radius: 50%; color: #9BC17E; font: 700 28px/1 system-ui, sans-serif; }
    h1 { margin: 0; color: #E4BF4A; font-size: 25px; }
    p { margin: 12px 0 22px; color: #A99C82; font: 15px/1.6 system-ui, sans-serif; }
    a { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border: 1px solid #C9A227; border-radius: 6px; background: #C9A227; color: #100D0A; font: 700 14px system-ui, sans-serif; text-decoration: none; }
    a:focus-visible { outline: 3px solid #E8DCC0; outline-offset: 3px; }
    @media (max-width: 360px) { main { padding: 24px 18px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" id="confirmation-mark" aria-hidden="true">✓</div>
    <h1 id="confirmation-title">Email confirmado!</h1>
    <p id="confirmation-message">Obrigado por criares a tua conta Nemesy RPG. O teu email foi confirmado com sucesso. Já podes iniciar sessão e continuar a aventura.</p>
    <a href="./index.html">Abrir Nemesy RPG</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error') || params.has('error_code')) {
      document.title = 'Confirmação não concluída · Nemesy RPG';
      document.getElementById('confirmation-mark').textContent = '!';
      document.getElementById('confirmation-title').textContent = 'Link de confirmação inválido';
      document.getElementById('confirmation-message').textContent = 'O link expirou ou já foi utilizado. Volta ao jogo e pede um novo email de confirmação.';
    }
  </script>
</body>
</html>
