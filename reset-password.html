<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100D0A">
  <title>Nova palavra-passe · Nemesy RPG</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; background: #100D0A; color: #E8DCC0; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 30px 24px; text-align: center; border: 1px solid #3D3020; border-radius: 10px; background: #1C1712; box-shadow: 0 16px 48px rgba(0, 0, 0, .35); }
    .mark { width: 58px; height: 58px; margin: 0 auto 16px; display: grid; place-items: center; border: 1px solid #C9A227; border-radius: 50%; color: #E4BF4A; font: 700 26px/1 system-ui, sans-serif; }
    .mark.ok { border-color: #729A5E; color: #9BC17E; }
    .mark.bad { border-color: #A34141; color: #E07A6A; }
    h1 { margin: 0; color: #E4BF4A; font-size: 24px; }
    p { margin: 12px 0 20px; color: #A99C82; font: 15px/1.6 system-ui, sans-serif; }
    form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    label { display: flex; flex-direction: column; gap: 6px; color: #E8DCC0; font: 600 13px system-ui, sans-serif; }
    input { min-height: 46px; padding: 0 12px; border: 1px solid #3D3020; border-radius: 6px; background: #100D0A; color: #E8DCC0; font: 15px system-ui, sans-serif; }
    input:focus { outline: 2px solid #C9A227; outline-offset: 1px; }
    button, a.btn { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border: 1px solid #C9A227; border-radius: 6px; background: #C9A227; color: #100D0A; font: 700 14px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible, a.btn:focus-visible { outline: 3px solid #E8DCC0; outline-offset: 3px; }
    .status { min-height: 20px; margin: 12px 0 0; font-size: 13px; text-align: center; }
    .status.error { color: #E07A6A; }
    [hidden] { display: none !important; }
    @media (max-width: 360px) { main { padding: 24px 18px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" id="mark" aria-hidden="true">🔑</div>
    <h1 id="title">Nova palavra-passe</h1>
    <p id="message">A verificar o link de recuperação…</p>
    <form id="reset-form" hidden>
      <label for="pw1"><span id="lbl1">Nova palavra-passe</span>
        <input id="pw1" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label for="pw2"><span id="lbl2">Repete a nova palavra-passe</span>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button id="save" type="submit">Guardar palavra-passe</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <a class="btn" id="back" href="./index.html" hidden>Abrir Nemesy RPG</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
  (function () {
    var en = false;
    try { en = localStorage.getItem('nemesy_lang') === 'en'; } catch (e) {}
    var T = en ? {
      title: 'New password', checking: 'Checking the recovery link…', ready: 'Choose a new password for your Nemesy RPG account (at least 6 characters).',
      l1: 'New password', l2: 'Repeat the new password', save: 'Save password', saving: 'Saving…', mismatch: 'The two passwords don\'t match.', short: 'The password needs at least 6 characters.',
      okTitle: 'Password changed!', ok: 'Your new password was saved. Open the game and sign in with it.', open: 'Open Nemesy RPG',
      badTitle: 'Invalid recovery link', bad: 'The link expired or was already used. Go back to the game and ask for a new one in "Forgot your password?".',
      noConfig: 'The account service isn\'t available right now. Try again later.', fail: 'Couldn\'t save the new password. '
    } : {
      title: 'Nova palavra-passe', checking: 'A verificar o link de recuperação…', ready: 'Escolhe uma nova palavra-passe para a tua conta Nemesy RPG (pelo menos 6 caracteres).',
      l1: 'Nova palavra-passe', l2: 'Repete a nova palavra-passe', save: 'Guardar palavra-passe', saving: 'A guardar…', mismatch: 'As duas palavras-passe não são iguais.', short: 'A palavra-passe precisa de pelo menos 6 caracteres.',
      okTitle: 'Palavra-passe alterada!', ok: 'A tua nova palavra-passe foi guardada. Abre o jogo e inicia sessão com ela.', open: 'Abrir Nemesy RPG',
      badTitle: 'Link de recuperação inválido', bad: 'O link expirou ou já foi usado. Volta ao jogo e pede um novo em "Esqueceste-te da palavra-passe?".',
      noConfig: 'O serviço de contas não está disponível agora. Tenta mais tarde.', fail: 'Não foi possível guardar a nova palavra-passe. '
    };
    if (en) document.documentElement.lang = 'en';
    var $ = function (id) { return document.getElementById(id); };
    $('title').textContent = T.title; $('message').textContent = T.checking;
    $('lbl1').textContent = T.l1; $('lbl2').textContent = T.l2; $('save').textContent = T.save; $('back').textContent = T.open;

    function fail() {
      $('mark').textContent = '!'; $('mark').className = 'mark bad';
      $('title').textContent = T.badTitle; $('message').textContent = T.bad;
      $('reset-form').hidden = true; $('back').hidden = false;
    }
    function ready() {
      if (!$('reset-form').hidden) return;
      $('message').textContent = T.ready; $('reset-form').hidden = false; $('pw1').focus();
    }
    var hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    var query = new URLSearchParams(location.search);
    if (hash.get('error') || query.get('error') || hash.get('error_code') || query.get('error_code')) { fail(); return; }

    var cfg = window.NEMESY_SUPABASE_CONFIG;
    if (!cfg || !cfg.url || !cfg.publishableKey || !window.supabase) { $('message').textContent = T.noConfig; $('back').hidden = false; return; }
    var client = window.supabase.createClient(cfg.url, cfg.publishableKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true } });
    var gotSession = false;
    client.auth.onAuthStateChange(function (event, session) {
      if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) { gotSession = true; ready(); }
    });
    // Link com ?code= (PKCE): troca o código por uma sessão.
    var code = query.get('code');
    if (code && client.auth.exchangeCodeForSession) {
      client.auth.exchangeCodeForSession(code).then(function (r) { if (r.error) fail(); else { gotSession = true; ready(); } });
    }
    setTimeout(function () {
      client.auth.getSession().then(function (r) {
        if (r && r.data && r.data.session) { gotSession = true; ready(); }
        else if (!gotSession) fail();
      });
    }, 2500);

    $('reset-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var a = $('pw1').value, b = $('pw2').value;
      $('status').className = 'status error';
      if (a.length < 6) { $('status').textContent = T.short; return; }
      if (a !== b) { $('status').textContent = T.mismatch; return; }
      $('save').disabled = true; $('save').textContent = T.saving; $('status').textContent = '';
      client.auth.updateUser({ password: a }).then(function (r) {
        $('save').disabled = false; $('save').textContent = T.save;
        if (r.error) { $('status').textContent = T.fail + (r.error.message || ''); return; }
        client.auth.signOut();
        history.replaceState(null, '', location.pathname);
        $('mark').textContent = '✓'; $('mark').className = 'mark ok';
        $('title').textContent = T.okTitle; $('message').textContent = T.ok;
        $('reset-form').hidden = true; $('status').textContent = ''; $('back').hidden = false;
      });
    });
  })();
  </script>
</body>
</html>
